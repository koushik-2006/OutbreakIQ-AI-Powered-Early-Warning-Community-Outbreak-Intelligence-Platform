version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: outbreakiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aurora_health
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/03_views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - ./database/04_seed_demo.sql:/docker-entrypoint-initdb.d/04_seed_demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aurora_health"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outbreakiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/aurora_health
      HOST: "0.0.0.0"
      PORT: 8000
      ENVIRONMENT: "production"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: outbreakiq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
