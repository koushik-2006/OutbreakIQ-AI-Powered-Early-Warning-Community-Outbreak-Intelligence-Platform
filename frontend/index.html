<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OutbreakIQ — AI-Powered Early-Warning Community Outbreak Engine (PS-021 | SYNAPSE '26). Detect unusual health patterns early, identify at-risk regions, and help public-health teams investigate." />
    <meta name="theme-color" content="#0B0F19" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>OutbreakIQ — Early-Warning Community Outbreak Engine</title>
  </head>
  <body class="bg-[#0B0F19] text-slate-100 antialiased selection:bg-brand-cyan/20 selection:text-brand-cyan">
    <div id="root">
      <!-- Loading indicator shown while bundle initializes or if Live Server is redirecting -->
      <div id="live-server-helper" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #0B0F19; color: #F1F5F9; font-family: 'Inter', system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(0, 240, 255, 0.2); border-top-color: #00F0FF; animation: spin 0.8s linear infinite; margin-bottom: 20px;"></div>
        <h2 style="font-size: 20px; font-weight: 700; margin: 0 0 8px 0; color: #FFFFFF;">Launching OutbreakIQ...</h2>
        <p style="font-size: 13px; color: #94A3B8; max-width: 440px; margin: 0 0 20px 0; line-height: 1.5;">
          Connecting to Early-Warning Community Outbreak Engine
        </p>
        <div style="display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;">
          <a href="./dist/index.html" style="background: #00F0FF; color: #0B0F19; font-weight: 600; padding: 10px 18px; border-radius: 10px; text-decoration: none; font-size: 13px;">
            Open in Live Server
          </a>
          <a href="http://localhost:5173" style="background: rgba(255,255,255,0.08); color: #E2E8F0; border: 1px solid rgba(255,255,255,0.15); padding: 10px 18px; border-radius: 10px; text-decoration: none; font-size: 13px;">
            Open Vite Dev Server (:5173)
          </a>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <!-- Live Server Detection & Redirection Script -->
    <script>
      (function() {
        // If opened through VS Code Live Server (port 5500) or static HTTP server without Vite
        var isLiveServer = window.location.port === '5500' || (window.location.protocol === 'http:' && window.location.port !== '5173');
        if (isLiveServer) {
          // Redirect immediately to compiled dist/index.html so Live Server renders the complete React app
          var target = window.location.pathname.replace(/\/index\.html$/, '') + '/dist/index.html' + window.location.hash;
          if (!window.location.pathname.includes('/dist/')) {
            window.location.replace(target);
          }
        }
      })();
    </script>

    <!-- Vite Dev Server Script -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
