<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00F0FF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Shield outline & background -->
  <path d="M50 8 L85 22 V50 C85 70 50 92 50 92 C50 92 15 70 15 50 V22 Z" fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round"/>
  <!-- ECG Heartbeat line -->
  <path d="M22 50 H36 L42 36 L48 64 L54 32 L60 58 L66 50 H78" stroke="url(#shieldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Central Pulse Dot -->
  <circle cx="54" cy="32" r="3" fill="#00F0FF" />
</svg>
